apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-staging
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/aakashrsethi39/k8s-gitops-config.git
    targetRevision: main
    path: charts/frontend

  destination:
    server: https://kubernetes.default.svc
    namespace: frontend-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true