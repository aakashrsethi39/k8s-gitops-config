apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-production
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/aakashrsethi39/k8s-gitops-config.git
    targetRevision: main
    path: charts/frontend

    helm:
      valueFiles:
        - ../../environments/production/frontend-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: frontend-production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true